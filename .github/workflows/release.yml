name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-strspc

      - name: Validate realm and entity files
        run: strspc-manager realm-lint rules/core/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-flight schema staleness check
        run: python3 tools/build-schema.py --check

      # The realm version is the release version. If the tag already exists
      # on another commit (docs-only or promotion merges), skip the release
      # instead of failing. If it exists on this commit, a previous run tagged
      # and then failed before publishing: resume so the release and website
      # publication complete.
      - name: Read realm version and create tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.realm.version' rules/core/realm.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::realm.version '${VERSION}' is not a release semver" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          if git fetch --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
            TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [[ "${TAG_SHA}" == "${GITHUB_SHA}" ]]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Tag ${TAG} already points at ${GITHUB_SHA}; resuming release"
              exit 0
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} already exists on ${TAG_SHA}; skipping release"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Package rules
        if: steps.tag.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          tar -czf "strspc-rules-${VERSION}.tar.gz" rules/ LICENSE NOTICE
          zip -r "strspc-rules-${VERSION}.zip" rules/ LICENSE NOTICE

      - name: Create release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            strspc-rules-*.tar.gz
            strspc-rules-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strspc-rules at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout strspc-www
        uses: actions/checkout@v4
        with:
          repository: SteerSpec/strspc-www
          ref: main
          token: ${{ secrets.WWW_PAT }}
          path: www

      - name: Copy schemas
        run: |
          mkdir -p www/schemas/entity
          cp rules/core/_schema/entity.v1.schema.json www/schemas/entity/v1.json
          cp rules/core/_schema/bootstrap.schema.json www/schemas/entity/bootstrap.json
          mkdir -p www/schemas/realm
          cp rules/core/_schema/realm.v1.schema.json www/schemas/realm/v1.json
          mkdir -p www/schemas/config
          cp rules/core/_schema/config.v1.schema.json www/schemas/config/v1.json

      - name: Copy versioned rules
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          rm -rf "www/rules/v${VERSION}"
          mkdir -p "www/rules/v${VERSION}/_schema"
          cp rules/core/*.json "www/rules/v${VERSION}/"
          cp rules/core/_schema/*.json "www/rules/v${VERSION}/_schema/"

      - name: Generate manifest
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          python3 tools/build-manifest.py \
            --version "$VERSION" \
            --output "www/rules/v${VERSION}/index.json"

      - name: Update latest
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          rm -rf www/rules/latest
          cp -r "www/rules/v${VERSION}" www/rules/latest

      # strspc-www main is protected (PR + approval + verified signatures),
      # so the publish lands as a pull request. Squash-merging it produces a
      # commit signed by GitHub; the branch commit itself is unsigned until
      # the workflow runs with a GitHub App token.
      - name: Open publish pull request on strspc-www
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: www
          token: ${{ secrets.WWW_PAT }}
          add-paths: |
            schemas/
            rules/
          commit-message: "chore: publish rules v${{ needs.release.outputs.version }}"
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: publish/rules-v${{ needs.release.outputs.version }}
          delete-branch: true
          title: "chore: publish rules v${{ needs.release.outputs.version }}"
          body: |
            Schemas and versioned rules from SteerSpec/strspc-rules ${{ needs.release.outputs.tag }}
            (`schemas/`, `rules/v${{ needs.release.outputs.version }}/`, `rules/latest/`), generated by
            its release workflow. Squash-merge so the commit on `main` is signed by GitHub.
