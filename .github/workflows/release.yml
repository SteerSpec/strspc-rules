name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-strspc

      - name: Validate realm and entity files
        run: strspc-manager realm-lint rules/core/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-flight schema staleness check
        run: python3 tools/build-schema.py --check

      # The realm version is the release version. If the tag already exists
      # (docs-only or promotion merges), skip the release instead of failing.
      - name: Read realm version and create tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.realm.version' rules/core/realm.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::realm.version '${VERSION}' is not a release semver" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} already exists; skipping release"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Package rules
        if: steps.tag.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          tar -czf "strspc-rules-${VERSION}.tar.gz" rules/ LICENSE NOTICE
          zip -r "strspc-rules-${VERSION}.zip" rules/ LICENSE NOTICE

      - name: Create release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            strspc-rules-*.tar.gz
            strspc-rules-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strspc-rules at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout strspc-www
        uses: actions/checkout@v4
        with:
          repository: SteerSpec/strspc-www
          ref: main
          token: ${{ secrets.WWW_PAT }}
          path: www

      - name: Copy schemas
        run: |
          mkdir -p www/schemas/entity
          cp rules/core/_schema/entity.v1.schema.json www/schemas/entity/v1.json
          cp rules/core/_schema/bootstrap.schema.json www/schemas/entity/bootstrap.json
          mkdir -p www/schemas/realm
          cp rules/core/_schema/realm.v1.schema.json www/schemas/realm/v1.json
          mkdir -p www/schemas/config
          cp rules/core/_schema/config.v1.schema.json www/schemas/config/v1.json

      - name: Copy versioned rules
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          rm -rf "www/rules/v${VERSION}"
          mkdir -p "www/rules/v${VERSION}/_schema"
          cp rules/core/*.json "www/rules/v${VERSION}/"
          cp rules/core/_schema/*.json "www/rules/v${VERSION}/_schema/"

      - name: Generate manifest
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          python3 tools/build-manifest.py \
            --version "$VERSION" \
            --output "www/rules/v${VERSION}/index.json"

      - name: Update latest
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          rm -rf www/rules/latest
          cp -r "www/rules/v${VERSION}" www/rules/latest

      - name: Commit and push to strspc-www
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          cd www
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schemas/ rules/
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "chore: publish rules v${VERSION}"
          git push
