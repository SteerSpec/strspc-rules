name: Build Schema

on:
  push:
    branches: [main, develop]
    paths:
      - 'rules/core/*.json'
      - 'rules/core/_schema/**'
      - 'tools/build-schema.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'rules/core/*.json'
      - 'rules/core/_schema/**'
      - 'tools/build-schema.py'

permissions:
  contents: read

jobs:
  build-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SteerSpec/strspc-CLI/.github/actions/setup-strspc@62318da295bfc753aa77ef676466b1422b32e211  # v1.15.0+
        with:
          version: "1.15.0"

      - name: Validate realm and entity files
        run: strspc realm validate rules/core/ --recursive --strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify schema is not stale
        run: python3 tools/build-schema.py --check
