name: Build Schema

on:
  push:
    branches: [main, develop]
    paths:
      - 'rules/core/*.json'
      - 'rules/core/_schema/**'
      - 'tools/build-schema.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'rules/core/*.json'
      - 'rules/core/_schema/**'
      - 'tools/build-schema.py'

permissions:
  contents: read

jobs:
  build-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify schema is not stale
        run: python3 tools/build-schema.py --check
