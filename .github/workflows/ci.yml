name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Realm validation, entity lint and lifecycle diff run through the org
  # reusable workflow (SteerSpec/.github) on the released CLI. Lifecycle
  # transitions are validated one PR at a time on the way into develop. A
  # release (the same-repository develop -> main PR, and the resulting push
  # to main) aggregates those steps, which rulediff reads as skipped states
  # (RD003) and body-edit-plus-promotion (RD001), so exactly those are
  # exempt from the diff; any other PR into main is checked.
  rules:
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      path: rules/core/
      diff: >-
        ${{ !(
          (
            github.event_name == 'pull_request'
            && github.base_ref == 'main'
            && github.head_ref == 'develop'
            && github.event.pull_request.head.repo.full_name == github.repository
          )
          || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        ) }}

  # Resolves the realm through .strspc/config.yaml, which the offline steps
  # above do not: realm-resolve is what verifies cross-realm references such
  # as inherits and overrides. Provider null, so this is static-only.
  check:
    uses: SteerSpec/.github/.github/workflows/strspc-check.yml@main
    permissions:
      contents: read
      pull-requests: read

  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -t tools -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .markdownlint.yml
          globs: |
            **/*.md
            !node_modules/**
            !.beads/**
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@v2
